# Administrations de la démonstration. Même format que membres.conf.
#
# Un connecteur porte l'identité du registre devant lequel il est posé.
# code                  uri                               dns                       uid    paires
service-concours        urn:sira:service:concours         service-concours          10001
service-bourses         urn:sira:service:bourses          service-bourses           10001
service-entreprises     urn:sira:service:entreprises      service-entreprises       10001
registre-etat-civil     urn:sira:registre:etat-civil      connecteur-etat-civil     10001
registre-nationalite    urn:sira:registre:nationalite     connecteur-nationalite    10001
registre-casier         urn:sira:registre:casier          connecteur-casier         10001
registre-diplomes       urn:sira:registre:diplomes        connecteur-diplomes       10001
# Profil « etranger » : connecteur posé devant le registre d'une autre équipe.
registre-etranger       urn:sira:registre:etranger        connecteur-etranger       10001
demo-db                 urn:sira:infra:demo-db            demo-db                   70     tls

# Les registres simulés ne sont pas des membres de Sira : ce certificat ne leur sert
# qu'à s'authentifier auprès de l'annuaire des agents (royaume demo-agents).
demo-etat-civil         urn:sira:demo:etat-civil          registre-etat-civil       10001  tls
demo-nationalite        urn:sira:demo:nationalite         registre-nationalite      10001  tls
demo-casier             urn:sira:demo:casier              registre-casier           10001  tls
demo-diplomes           urn:sira:demo:diplomes            registre-diplomes         10001  tls
