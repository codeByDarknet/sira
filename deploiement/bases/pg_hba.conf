# Accès aux bases de Sira.
# Administration : uniquement par le socket local du conteneur.
local    all  postgres       peer
# Le superutilisateur ne se connecte jamais par le réseau, même avec son mot de passe.
host     all  postgres  all  reject
# Composants : TLS obligatoire, mot de passe SCRAM propre à chaque rôle.
hostssl  all  all       all  scram-sha-256
