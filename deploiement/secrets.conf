# Secrets du socle, générés au premier démarrage par le conteneur « pki ». Rien n'est dans le dépôt.
#
# nom            nom de l'exemplaire maître (conservé avec la clé de l'autorité)
# genre          hex (mot de passe de 48 caractères) | cle (32 octets en base64) | court (25 caractères, conforme aux règles de mot de passe)
# destinations   <composant>/<fichier>:<uid du lecteur>, une ou plusieurs.
#                Le composant monte son dossier en /run/sira/secrets, en lecture seule.
#
# Un fichier <instance>/roles/<role> crée dans cette instance PostgreSQL le rôle <role>
# et sa base du même nom (voir deploiement/bases/roles.sh).
#
# nom                     genre  destinations
superutilisateur-socle    hex    socle-db/superutilisateur:70
base-keycloak             hex    socle-db/roles/keycloak:70      identite/base.motdepasse:1000
base-passerelle           hex    socle-db/roles/passerelle:70    passerelle/base.motdepasse:10001
pseudonymisation          cle    passerelle/pseudonymisation.cle:10001
amorcage-keycloak         hex    identite/amorcage.motdepasse:1000
