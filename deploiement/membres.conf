# Membres du socle et certificats d'infrastructure émis par l'autorité interne.
# Lu par le conteneur « pki » à chaque démarrage (idempotent).
#
# code         dossier du membre dans le volume PKI (monté en /run/sira/pki par son conteneur)
# uri          identité du membre : champ SAN URI de ses certificats (contrat §5.2)
# dns          noms DNS du certificat de transport, séparés par des virgules
# uid          utilisateur du conteneur qui lit les clés (10001 : applications Java ; 1000 : Keycloak ; 70 : PostgreSQL)
# paires       par défaut tls,cachet,chiffrement
#
# code            uri                             dns              uid    paires
passerelle        urn:sira:socle:passerelle       passerelle       10001
espace-citoyen    urn:sira:socle:espace-citoyen   espace-citoyen   10001
console           urn:sira:socle:console          console          10001
identite          urn:sira:socle:identite         fournisseur-identite 1000 tls
# Porte mTLS des serveurs vers Keycloak : c'est elle qui répond au nom « keycloak », sous l'identité
# du fournisseur, la seule que les clients mTLS acceptent pour les jetons et les clés (contrat §5).
acces-identite    urn:sira:socle:identite         keycloak         101    tls
socle-db          urn:sira:infra:socle-db         socle-db         70     tls
