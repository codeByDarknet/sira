# nginx des interfaces web de Sira. Le conteneur tourne sans privilège et peut être lancé
# en lecture seule : tout ce qui s'écrit va dans /tmp.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Journal sans chaîne de requête : un code d'autorisation ou un jeton n'y laisse pas de trace.
  log_format sira '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout sira;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  client_body_temp_path /tmp/corps;
  proxy_temp_path /tmp/relais;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Produit au démarrage à partir de /etc/nginx/templates/sira-web.conf.template.
  include /tmp/sira/*.conf;
}
