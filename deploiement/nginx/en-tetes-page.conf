# En-têtes de la page d'entrée des applications (index.html et adresses d'écran).
# Identiques à en-tetes.conf, à une exception près : les styles portant le nonce de la requête
# sont acceptés. PrimeNG pose ses styles de thème à l'exécution dans des balises <style> ; il
# reçoit ce nonce au démarrage (attribut ngCspNonce, remplacé ci-dessous par sub_filter).
# Les scripts restent limités à la même origine, sans exception.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control "no-cache" always;
