# En-têtes de sécurité de toutes les pages. nginx n'hérite pas des « add_header » dès qu'un
# bloc en déclare un : ce fichier est donc inclus dans chaque bloc qui en ajoute.
#
# Politique de contenu : tout vient de la même origine. Aucun script ni style en ligne,
# aucune ressource tierce, aucune intégration dans une autre page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
