# Profil « etranger » (registre d'une autre équipe, docs/brancher-un-registre.md) : la clé d'API
# est remise au registre et à son connecteur ; la base du connecteur, comme pour les autres.
base-connecteur-etranger        hex    socle-db/roles/connecteur_etranger:70       registre-etranger/base.motdepasse:10001
cle-api-registre-etranger       hex    etranger/cle-api:1000                       registre-etranger/cle-api:10001

# Comptes de démonstration : les fichiers de identite/import/ deviennent des variables
# substituées dans les fichiers de royaume. « scripts/sira comptes » les affiche.
# Aucune graine TOTP : chaque administrateur ajoute son application à sa première connexion,
# sur la page où Keycloak affiche un QR code tiré au hasard (comme pour un vrai compte).
demo-mot-de-passe               court  identite/import/SIRA_DEMO_MOT_DE_PASSE:1000
