        in: query
        description: 'Filtre sur le type de ligne (vide ou absent : tous).'
        schema: {type: string, maxLength: 32}
      - name: service
        in: query
        description: Filtre sur le code du service.
        schema: {type: string, maxLength: 64}
      - name: page
        in: query
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      - name: taille
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page de lignes.
          content:
            application/json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/PageDeLignes}
              example:
                elements:
                - id: 0b7c2f1e-5a3d-4e8b-9c61-2d4f8a6e1b03
                  numero: 1284
                  horodatage: '2026-11-16T09:42:17.512Z'
                  type: CONSULTATION
                  resultat: REUSSI
                  pseudonyme: null
                  service: {code: concours, nom: Concours directs 2026}
                  registre: {code: etat-civil, nom: État civil}
                  jeu: {code: etat-civil.majeur, libelle: Vous êtes majeur, niveau: STATUT}
                  niveau: STATUT
                  demarche: {code: concours-direct, libelle: Inscription à un concours direct}
                  finalite: Vérifier que vous remplissez les conditions du concours.
                  canal: CODE
                  id_echange: 6f1d0c9a-27b4-4a5e-8f3c-91e2b7d4a650
                  detail: null
                  acteur: null
                  objet: null
                  signalee: false
                page: 1
                taille: 20
                total: 1
        '400':
          description: |-
            Passerelle : paramètre ou corps refusé (`urn:sira:erreur:requete-invalide`, code `VALIDATION` et liste `erreurs` pour un corps).

            Relais : Paramètres refusés par le relais (plus de 12, nom hors `[a-z][a-z0-9_]{0,31}`, valeur de plus de 200 caractères : `urn:sira:erreur:requete-invalide`), ou requête refusée par la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example:
                type: urn:sira:erreur:requete-invalide
                title: Requête invalide
                status: 400
                code: VALIDATION
                erreurs:
                - {champ: motif, message: La longueur de ce champ n'est pas admise.}
        '401':
          description: |-
            Passerelle : jeton absent ou refusé (`urn:sira:erreur:non-authentifie`).

            Relais : Pas de session, jeton non renouvelable, ou jeton refusé par la passerelle (`urn:sira:erreur:non-authentifie`) ; la session est alors fermée et l'interface reconnecte.
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
        '403':
          description: |-
            Passerelle : certificat d'un autre membre, ou rôle insuffisant (`urn:sira:erreur:acces-refuse`).

            Relais : Jeton CSRF absent ou faux pour une écriture, ou accès refusé par la passerelle (`urn:sira:erreur:acces-refuse`).
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
        '404':
          description: Route hors de la liste blanche, identifiant difforme (`urn:sira:erreur:introuvable`), ou
            objet introuvable pour la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:introuvable', title: Ressource introuvable, status: 404}
        '415':
          description: Corps envoyé dans un autre format que JSON (`urn:sira:erreur:format-non-pris-en-charge`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:format-non-pris-en-charge', title: Format non pris en charge, status: 415}
        '502':
          description: 'Réponse inattendue de la passerelle (redirection, autre format que JSON, plus de la taille
            admise) : rien n''est transmis (`urn:sira:erreur:reponse-passerelle-invalide`).'
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:reponse-passerelle-invalide', title: Réponse inattendue de la passerelle,
                status: 502}
        '503':
          description: Passerelle injoignable (`urn:sira:erreur:indisponible`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:indisponible', title: Service momentanément indisponible, status: 503}
  /api/journal/{id}/signalement:
    post:
      tags: [Relais]
      operationId: signalerUnAcces
      summary: Contester un accès lu dans son historique
      description: Relayée telle quelle vers `POST /v1/citoyen/journal/{id}/signalement` de la passerelle (`journal/openapi.yaml`),
        avec le certificat du serveur et le jeton du citoyen. Statuts et corps de la passerelle sont rendus sans
        retouche.
      x-sira-source: relais
      security:
      - sessionCitoyen: []
        jetonCsrf: []
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../journal/openapi.yaml#/components/schemas/MotifDeSignalement}
            example: {motif: Je n'ai fait aucune démarche auprès de ce service ce jour-là.}
      responses:
        '201':
          description: Signalement enregistré.
          content:
            application/json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Recu}
              example: {id: 4c8e2a17-9b3f-4d61-a0e5-7f2c9d1b8e44, cree_le: '2026-11-16T10:03:55.201Z'}
        '400':
          description: |-
            Passerelle : paramètre ou corps refusé (`urn:sira:erreur:requete-invalide`, code `VALIDATION` et liste `erreurs` pour un corps).

            Relais : Paramètres refusés par le relais (plus de 12, nom hors `[a-z][a-z0-9_]{0,31}`, valeur de plus de 200 caractères : `urn:sira:erreur:requete-invalide`), ou requête refusée par la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example:
                type: urn:sira:erreur:requete-invalide
                title: Requête invalide
                status: 400
                code: VALIDATION
                erreurs:
                - {champ: motif, message: La longueur de ce champ n'est pas admise.}
        '401':
          description: |-
            Passerelle : jeton absent ou refusé (`urn:sira:erreur:non-authentifie`).

            Relais : Pas de session, jeton non renouvelable, ou jeton refusé par la passerelle (`urn:sira:erreur:non-authentifie`) ; la session est alors fermée et l'interface reconnecte.
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
        '403':
          description: |-
            Passerelle : certificat d'un autre membre, ou rôle insuffisant (`urn:sira:erreur:acces-refuse`).

            Relais : Jeton CSRF absent ou faux pour une écriture, ou accès refusé par la passerelle (`urn:sira:erreur:acces-refuse`).
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
        '404':
          description: |-
            Passerelle : cette ligne n'existe pas ou n'est pas une ligne de ce citoyen (`urn:sira:erreur:introuvable`).

            Relais : Route hors de la liste blanche, identifiant difforme (`urn:sira:erreur:introuvable`), ou objet introuvable pour la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
        '409':
          description: Ligne déjà signalée (`urn:sira:erreur:conflit`, code `CONFLIT`).
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:conflit', title: Conflit avec l'état actuel, status: 409, detail: Vous
                  avez déjà signalé cet accès., code: CONFLIT}
        '413':
          description: Corps au-delà de `sira.http.taille-corps-max` (`urn:sira:erreur:corps-trop-volumineux`).
          content:
            application/problem+json:
              schema: {$ref: ../journal/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:corps-trop-volumineux', title: Corps trop volumineux, status: 413}
        '415':
          description: Corps envoyé dans un autre format que JSON (`urn:sira:erreur:format-non-pris-en-charge`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:format-non-pris-en-charge', title: Format non pris en charge, status: 415}
        '502':
          description: 'Réponse inattendue de la passerelle (redirection, autre format que JSON, plus de la taille
            admise) : rien n''est transmis (`urn:sira:erreur:reponse-passerelle-invalide`).'
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:reponse-passerelle-invalide', title: Réponse inattendue de la passerelle,
                status: 502}
        '503':
          description: Passerelle injoignable (`urn:sira:erreur:indisponible`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:indisponible', title: Service momentanément indisponible, status: 503}
  /api/session:
    get:
      tags: [Session]
      operationId: lireSession
      x-sira-source: commun
      summary: Qui est connecté
      description: Appelée au chargement de l'interface ; pose aussi le cookie `XSRF-TOKEN` (lisible par le script)
        à renvoyer dans l'en-tête `X-XSRF-TOKEN` à chaque écriture.
      security:
      - sessionCitoyen: []
      responses:
        '200':
          description: Le citoyen connecté.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example:
                nom: Awa Ouédraogo
                roles: []
        '401':
          description: Pas de session (`urn:sira:erreur:non-authentifie`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
  /api/auth/connexion/sira:
    get:
      tags: [Session]
      operationId: seConnecter
      x-sira-source: securite
      summary: Partir vers le fournisseur d'identité
      description: 'Code d''autorisation avec PKCE, royaume `sira-citoyens`. Les jetons restent sur le serveur :
        le navigateur ne reçoit que le cookie de session.'
      security: []
      parameters:
      - name: retour
        in: query
        required: false
        description: Page de l'interface où revenir après la connexion. Seul un chemin local est retenu (commence
          par `/`, pas par `//`, sans `\` ni caractère de contrôle, 512 caractères au plus) ; sinon `/`.
        schema: {type: string, maxLength: 512}
        example: /accord/8d2f4b61-3c7e-4a90-b5d1-0e9f6a2c7b14
      responses:
        '302':
          description: Redirection vers le point d'autorisation du fournisseur d'identité.
          headers:
            Location:
              schema: {type: string, format: uri}
  /api/auth/retour:
    get:
      tags: [Session]
      operationId: revenirDuFournisseur
      x-sira-source: securite
      summary: Retour du fournisseur d'identité
      security: []
      parameters:
      - name: code
        in: query
        schema: {type: string}
      - name: state
        in: query
        schema: {type: string}
      responses:
        '302':
          description: 'Session ouverte : redirection vers l''adresse publique suivie du chemin `retour` mémorisé
            (ou `/`). Échec : redirection vers `/?erreur=connexion`.'
          headers:
            Location:
              schema: {type: string, format: uri}
              example: http://citoyen.sira.localhost:8600/
  /api/auth/deconnexion:
    post:
      tags: [Session]
      operationId: seDeconnecter
      x-sira-source: securite
      summary: Fermer la session
      description: Ferme la session locale et rend l'adresse de fin de session du fournisseur, que le navigateur
        suit.
      security:
      - sessionCitoyen: []
        jetonCsrf: []
      responses:
        '200':
          description: Session fermée.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                additionalProperties: false
                properties:
                  url: {type: string, format: uri}
              example: {url: 'http://identite.sira.localhost:8600/realms/sira-citoyens/protocol/openid-connect/logout?client_id=espace-citoyen&post_logout_redirect_uri=http%3A%2F%2Fcitoyen.sira.localhost%3A8600%2F'}
        '401':
          description: Pas de session (`urn:sira:erreur:non-authentifie`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
        '403':
          description: Jeton CSRF absent ou faux (`urn:sira:erreur:acces-refuse`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
components:
  securitySchemes:
    sessionCitoyen: {type: apiKey, in: cookie, name: SIRA_CITOYEN, description: Cookie de session ouvert par `/api/auth/connexion/sira`.}
    jetonCsrf: {type: apiKey, in: header, name: X-XSRF-TOKEN, description: 'Valeur du cookie `XSRF-TOKEN`, exigée
        pour toute écriture.'}
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: UUID (demande, autorisation, ligne). Le relais laisse aussi passer un numéro de 1 à 19 chiffres
        ; toute autre forme répond `404` sans atteindre la passerelle.
      schema: {type: string, pattern: '^([0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}|[0-9]{1,19})$'}
  schemas:
    Session:
      type: object
      required: [nom, roles]
      additionalProperties: false
      properties:
        nom: {type: [string, 'null'], description: 'Nom complet, sinon identifiant de connexion ; null si le jeton ne porte ni l''un ni l''autre.'}
        roles:
          type: array
          items: {type: string}
