openapi: 3.1.0
info:
  title: Sira — Espace citoyen (serveur)
  version: 0.1.0
  summary: Session OIDC du citoyen et relais fermé vers les routes /v1/citoyen de la passerelle.
  description: |
    Le serveur `sira-espace-citoyen` est derrière le nginx de l'interface, qui ne relaie que `/api/`.
    Le navigateur n'y a qu'un cookie de session : les jetons du royaume `sira-citoyens` restent sur le
    serveur, qui les présente à la passerelle avec son certificat `urn:sira:socle:espace-citoyen`.

    - `/api/<suite>` est relayée vers `/v1/citoyen/<suite>` si, et seulement si, elle figure dans la liste
      blanche (`RoutesCitoyen`). Les corps et statuts de la passerelle sont rendus tels quels : leurs
      schémas sont ceux de `consentement-minimisation/openapi.yaml` et `journal/openapi.yaml`.
    - Tout le reste répond `404` sans atteindre la passerelle.
    - Sans session, toute route protégée répond `401` en JSON, jamais une redirection.

    Erreurs RFC 9457 en `application/problem+json`.
  license: {name: Licence du dépôt Sira}
servers:
- {url: 'http://citoyen.sira.localhost:8600', description: Démonstration locale (derrière le nginx de l'interface)}
tags:
- {name: Session, description: Connexion OIDC (royaume `sira-citoyens`) et session.}
- {name: Relais, description: Routes du citoyen relayées vers la passerelle.}
paths:
  /api/resume:
    get:
      tags: [Relais]
      operationId: lireResume
      summary: Les compteurs de l'accueil
      description: Relayée telle quelle vers `GET /v1/citoyen/resume` de la passerelle (`consentement-minimisation/openapi.yaml`),
        avec le certificat du serveur et le jeton du citoyen. Statuts et corps de la passerelle sont rendus sans
        retouche.
      x-sira-source: relais
      security:
      - sessionCitoyen: []
      responses:
        '200':
          description: Compteurs du citoyen du jeton.
          content:
            application/json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Resume}
              example: {demandes_en_attente: 1, autorisations_actives: 2, consultations_30_jours: 7}
        '400':
          description: 'Paramètres refusés par le relais (plus de 12, nom hors `[a-z][a-z0-9_]{0,31}`, valeur de
            plus de 200 caractères : `urn:sira:erreur:requete-invalide`), ou requête refusée par la passerelle.'
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
        '401':
          description: |-
            Passerelle : jeton absent ou refusé (`urn:sira:erreur:non-authentifie`).

            Relais : Pas de session, jeton non renouvelable, ou jeton refusé par la passerelle (`urn:sira:erreur:non-authentifie`) ; la session est alors fermée et l'interface reconnecte.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
        '403':
          description: |-
            Passerelle : certificat d'un autre membre, ou jeton sans identifiant unique (`urn:sira:erreur:acces-refuse`).

            Relais : Jeton CSRF absent ou faux pour une écriture, ou accès refusé par la passerelle (`urn:sira:erreur:acces-refuse`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
        '404':
          description: Route hors de la liste blanche, identifiant difforme (`urn:sira:erreur:introuvable`), ou
            objet introuvable pour la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:introuvable', title: Ressource introuvable, status: 404}
        '415':
          description: Corps envoyé dans un autre format que JSON (`urn:sira:erreur:format-non-pris-en-charge`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:format-non-pris-en-charge', title: Format non pris en charge, status: 415}
        '502':
          description: 'Réponse inattendue de la passerelle (redirection, autre format que JSON, plus de la taille
            admise) : rien n''est transmis (`urn:sira:erreur:reponse-passerelle-invalide`).'
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:reponse-passerelle-invalide', title: Réponse inattendue de la passerelle,
                status: 502}
        '503':
          description: Passerelle injoignable (`urn:sira:erreur:indisponible`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:indisponible', title: Service momentanément indisponible, status: 503}
  /api/demandes:
    get:
      tags: [Relais]
      operationId: listerMesDemandes
      summary: Les demandes du citoyen, les plus récentes d'abord
      description: Relayée telle quelle vers `GET /v1/citoyen/demandes` de la passerelle (`consentement-minimisation/openapi.yaml`),
        avec le certificat du serveur et le jeton du citoyen. Statuts et corps de la passerelle sont rendus sans
        retouche.
      x-sira-source: relais
      security:
      - sessionCitoyen: []
      parameters:
      - name: etat
        in: query
        schema: {type: string, pattern: '^[A-Z_]{0,32}$'}
      - name: page
        in: query
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      - name: taille
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page de demandes.
          content:
            application/json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/PageDeDemandes}
              example:
                elements:
                - id: 8d2f4b61-3c7e-4a90-b5d1-0e9f6a2c7b14
                  etat: EN_ATTENTE_ACCORD
                  canal: CODE
                  creee_le: '2026-11-16T09:30:00Z'
                  expire_le: '2026-11-16T09:45:00Z'
                  code_verification_exige: true
                  service: {code: concours, nom: Concours directs 2026, organisme: Ministère de la Fonction publique}
                  demarche: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier
                      que vous remplissez les conditions du concours., duree_autorisation_jours: 30}
                  jeux:
                  - code: etat-civil.majeur
                    libelle: Vous êtes majeur
                    niveau: STATUT
                    registre: {code: etat-civil, nom: État civil}
                    detail: 'Réponse : oui ou non'
                page: 1
                taille: 20
                total: 1
        '400':
          description: |-
            Passerelle : paramètre ou corps refusé (`urn:sira:erreur:requete-invalide`, code `VALIDATION` et liste `erreurs` pour un corps).

            Relais : Paramètres refusés par le relais (plus de 12, nom hors `[a-z][a-z0-9_]{0,31}`, valeur de plus de 200 caractères : `urn:sira:erreur:requete-invalide`), ou requête refusée par la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example:
                type: urn:sira:erreur:requete-invalide
                title: Requête invalide
                status: 400
                code: VALIDATION
                erreurs:
                - {champ: code_court, message: Le format de ce champ n'est pas admis.}
        '401':
          description: |-
            Passerelle : jeton absent ou refusé (`urn:sira:erreur:non-authentifie`).

            Relais : Pas de session, jeton non renouvelable, ou jeton refusé par la passerelle (`urn:sira:erreur:non-authentifie`) ; la session est alors fermée et l'interface reconnecte.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
        '403':
          description: |-
            Passerelle : certificat d'un autre membre, ou jeton sans identifiant unique (`urn:sira:erreur:acces-refuse`).

            Relais : Jeton CSRF absent ou faux pour une écriture, ou accès refusé par la passerelle (`urn:sira:erreur:acces-refuse`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
        '404':
          description: Route hors de la liste blanche, identifiant difforme (`urn:sira:erreur:introuvable`), ou
            objet introuvable pour la passerelle.
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:introuvable', title: Ressource introuvable, status: 404}
        '415':
          description: Corps envoyé dans un autre format que JSON (`urn:sira:erreur:format-non-pris-en-charge`).
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
              example: {type: 'urn:sira:erreur:format-non-pris-en-charge', title: Format non pris en charge, status: 415}
        '502':
          description: 'Réponse inattendue de la passerelle (redirection, autre format que JSON, plus de la taille
            admise) : rien n''est transmis (`urn:sira:erreur:reponse-passerelle-invalide`).'
          content:
            application/problem+json:
              schema: {$ref: ../consentement-minimisation/openapi.yaml#/components/schemas/Probleme}
