                - {$ref: '#/components/schemas/PageCommune'}
                - type: object
                  properties:
                    elements:
                      type: array
                      items: {$ref: '#/components/schemas/MembreDeclareLu'}
              example:
                elements:
                - code: concours
                  nom: Concours directs 2026
                  organisme: Ministère de la Fonction publique
                  roles: [SERVICE]
                  retours_autorises: ['https://concours.sira.localhost/retour']
                  actif: true
                  identite: urn:sira:service:concours
                page: 1
                taille: 20
                total: 1
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
    post:
      operationId: creerMembre
      summary: Créer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembreDeclare'}
            example:
              code: concours
              nom: Concours directs 2026
              organisme: Ministère de la Fonction publique
              roles: [SERVICE]
              retours_autorises: ['https://concours.sira.localhost/retour']
              actif: true
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`.'
      responses:
        '201':
          description: Créé (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembreDeclareLu'}
              example:
                code: concours
                nom: Concours directs 2026
