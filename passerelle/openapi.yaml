  /v1/admin/statistiques:
    get:
      operationId: lireStatistiques
      summary: Compteurs du jour (UTC) et pièces évitées depuis l'origine
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: Compteurs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Statistiques'}
              example: {demandes_jour: 12, accords_jour: 9, refus_jour: 1, consultations_jour: 9, pieces_evitees_total: 214}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
components:
  securitySchemes:
    certificatMembre: {type: mutualTLS, description: 'Certificat client émis par l''autorité Sira ; l''identité
        est l''URI du SAN. `/v1/demandes/**` et `/v1/demarches/**` : `urn:sira:service:<code>`. `/v1/admin/**` :
        `urn:sira:socle:console`. Toute autre identité reçoit `403`.'}
    jetonSocle: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Jeton du royaume `sira-socle`, lié
        au certificat de la console ; les rôles du royaume donnent les droits.'}
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
    Taille:
      name: taille
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Code:
      name: code
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    IdDemande:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdHabilitation:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    RequeteInvalide:
      description: Paramètre ou corps refusé (`urn:sira:erreur:requete-invalide`, code `VALIDATION` et liste `erreurs`
        pour un corps).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example:
            type: urn:sira:erreur:requete-invalide
            title: Requête invalide
            status: 400
            code: VALIDATION
            erreurs:
            - {champ: demarche, message: Le format de ce champ n'est pas admis.}
    NonAuthentifie:
      description: Certificat ou jeton absent ou refusé (`urn:sira:erreur:non-authentifie`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:non-authentifie', title: Authentification requise, status: 401}
    AccesRefuse:
      description: Certificat d'un autre membre, ou rôle insuffisant (`urn:sira:erreur:acces-refuse`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:acces-refuse', title: Accès refusé, status: 403}
    Introuvable:
      description: Objet absent (`urn:sira:erreur:introuvable`, code `INTROUVABLE`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:introuvable', title: Ressource introuvable, status: 404, code: INTROUVABLE}
    DemandeIntrouvable:
      description: Demande absente, ou celle d'un autre (`urn:sira:erreur:demande-introuvable`, code `DEMANDE_INTROUVABLE`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:demande-introuvable', title: Demande introuvable, status: 404, detail: Cette
              demande n'existe pas ou n'existe plus., code: DEMANDE_INTROUVABLE}
    Conflit:
      description: Action qui ne convient pas à l'état actuel (`urn:sira:erreur:conflit`, code `CONFLIT`) ; `detail`
        dit pourquoi.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:conflit', title: Conflit avec l'état actuel, status: 409, detail: Seul
              un brouillon peut être soumis., code: CONFLIT}
    CorpsTropVolumineux:
      description: Corps au-delà de la borne `sira.http.taille-corps-max` (256 Kio par défaut), refusé avant toute
        lecture (`urn:sira:erreur:corps-trop-volumineux`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Probleme'}
          example: {type: 'urn:sira:erreur:corps-trop-volumineux', title: Corps trop volumineux, status: 413}
  schemas:
    Probleme:
      type: object
      description: Problème RFC 9457. `code` et `erreurs` ne sont présents que lorsqu'ils s'appliquent.
      required: [type, title, status]
      additionalProperties: false
      properties:
        type: {type: string, pattern: '^urn:sira:erreur:[a-z0-9-]+$'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        code: {type: string, pattern: '^[A-Z0-9_]+$'}
        erreurs:
          type: array
          items:
            type: object
            required: [champ]
            additionalProperties: false
            properties:
              champ: {type: string}
              message: {type: string}
              regle: {type: string}
        reference: {type: string, description: Référence à citer pour une erreur interne (500).}
    PageCommune:
      type: object
      required: [elements, page, taille, total]
      additionalProperties: false
      properties:
        elements: {type: array}
        page: {type: integer, minimum: 1}
        taille: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    Niveau:
      type: string
      enum: [STATUT, CHAMPS, DOCUMENT]
    Operateur:
      type: string
      enum: [EGAL, DIFFERENT, AU_MOINS, AU_PLUS, AGE_AU_MOINS, AGE_AU_PLUS, EXISTE, AUCUN, ENCORE_VALIDE]
    RoleMembre:
      type: string
      enum: [SERVICE, REGISTRE]
    EtatHabilitation:
      type: string
      enum: [BROUILLON, SOUMISE, APPROUVEE, REJETEE, SUSPENDUE]
    Demarche:
      type: object
      required: [code, libelle, finalite, service, duree_autorisation_jours]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        libelle: {type: string, minLength: 1, maxLength: 200}
        finalite: {type: string, minLength: 1, maxLength: 500}
        base_legale:
          type: [string, 'null']
          maxLength: 500
        service: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$', description: Code du membre de
            rôle SERVICE.}
        duree_autorisation_jours: {type: integer, minimum: 0, maximum: 3650, description: '`0` : pour cette fois.'}
        actif:
          type: [boolean, 'null']
          description: 'Absent : vrai.'
    Regle:
      type: object
      required: [champ, operateur]
      additionalProperties: false
      properties:
        champ: {type: string, pattern: '^([A-Za-z0-9_.]{1,128})$'}
        operateur: {$ref: '#/components/schemas/Operateur'}
        valeur: {description: Seuil ou valeur attendue ; absente pour les opérateurs qui n'en demandent pas.}
    Jeu:
      type: object
      required: [code, registre, niveau, libelle, validite]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^([a-z0-9][a-z0-9.-]{0,126}[a-z0-9])$'}
        registre: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        niveau: {$ref: '#/components/schemas/Niveau'}
        libelle: {type: string, minLength: 1, maxLength: 200}
        description:
          type: [string, 'null']
          maxLength: 1000
        validite: {type: string, minLength: 1, maxLength: 32, description: 'Durée ISO 8601, d''un instant à 366
            jours (ex. `P90D`).'}
        regle:
          oneOf:
          - {type: 'null'}
          - {$ref: '#/components/schemas/Regle'}
          description: Niveau STATUT.
        champs:
          type: [array, 'null']
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^([A-Za-z0-9_.]{1,128})$'}
          description: Niveau CHAMPS.
        document:
          type: [string, 'null']
          pattern: ^([a-z0-9][a-z0-9-]{0,63})$
          description: Niveau DOCUMENT.
        actif:
          type: [boolean, 'null']
    MembreDeclare:
      type: object
      required: [code, nom, organisme, roles]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        nom: {type: string, minLength: 1, maxLength: 200}
        organisme: {type: string, minLength: 1, maxLength: 200}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/RoleMembre'}
        retours_autorises:
          type: [array, 'null']
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 500}
        actif:
          type: [boolean, 'null']
        identite:
          type: [string, 'null']
          readOnly: true
          description: Identité portée par son certificat, déduite du code.
    Registre:
      type: object
      required: [code, nom, membre, adresse, transport]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        nom: {type: string, minLength: 1, maxLength: 200}
        membre: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$', description: Code du membre de
            rôle REGISTRE.}
        adresse: {type: string, pattern: '^(https://[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?(:[0-9]{1,5})?)$',
          description: Adresse du connecteur.}
        transport:
          type: string
          enum: [DIRECT]
        actif:
          type: [boolean, 'null']
    DemarcheLu:
      allOf:
      - {$ref: '#/components/schemas/Demarche'}
      - type: object
        required: [code, libelle, finalite, base_legale, service, duree_autorisation_jours, actif]
      description: 'Tel que rendu : tous les champs sont présents, `null` compris.'
    MembreDeclareLu:
      allOf:
      - {$ref: '#/components/schemas/MembreDeclare'}
      - type: object
        required: [code, nom, organisme, roles, retours_autorises, actif, identite]
      description: 'Tel que rendu : tous les champs sont présents, `null` compris.'
    RegistreLu:
      allOf:
      - {$ref: '#/components/schemas/Registre'}
      - type: object
        required: [code, nom, membre, adresse, transport, actif]
      description: 'Tel que rendu : tous les champs sont présents, `null` compris.'
    JeuLu:
      allOf:
      - {$ref: '#/components/schemas/Jeu'}
      - type: object
        required: [code, registre, niveau, libelle, description, validite, regle, champs, document, actif]
      description: 'Tel que rendu : tous les champs sont présents, `null` compris.'
    SaisieHabilitation:
      type: object
      required: [service, demarche, jeux, justification]
      additionalProperties: false
      properties:
        service: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        demarche: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        jeux:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, pattern: '^([a-z0-9][a-z0-9.-]{0,126}[a-z0-9])$'}
        justification: {type: string, minLength: 1, maxLength: 2000}
    Habilitation:
      type: object
      required: [id, service, demarche, jeux, etat, justification, motif, instruite_par, decidee_par, decidee_le,
        creee_le]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        service: {type: string}
        demarche: {type: string}
        jeux:
          type: array
          items: {type: string}
        etat: {$ref: '#/components/schemas/EtatHabilitation'}
        justification:
          type: [string, 'null']
        motif:
          type: [string, 'null']
          description: Motif du rejet ou de la suspension.
        instruite_par:
          type: [string, 'null']
        decidee_par:
          type: [string, 'null']
        decidee_le:
          type: [string, 'null']
          format: date-time
        creee_le: {type: string, format: date-time}
    Motif:
      type: object
      required: [motif]
      additionalProperties: false
      properties:
        motif: {type: string, minLength: 1, maxLength: 1000}
    NouvelleDemande:
      type: object
      required: [demarche, canal, certificat_chiffrement]
      additionalProperties: false
      properties:
        demarche: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
        canal:
          type: string
          enum: [REDIRECTION, CODE, NOTIFICATION]
        retour_url:
          type: [string, 'null']
          maxLength: 500
          description: 'REDIRECTION : une adresse déclarée pour le service, à l''identique.'
        identifiant_unique:
          type: [string, 'null']
          pattern: ^([A-Za-z0-9]{6,32})$
          description: 'Désigne le citoyen. NOTIFICATION : lui ou `pseudonyme`. REDIRECTION et CODE : facultatif ; seule
            cette personne pourra donner ou refuser l''accord.'
        pseudonyme:
          type: [string, 'null']
          pattern: ^([A-Za-z0-9_=+/.-]{1,128})$
          description: 'NOTIFICATION : le pseudonyme du citoyen chez ce service.'
        certificat_chiffrement: {type: string, minLength: 1, maxLength: 32768, description: PEM du certificat de
            chiffrement émis par l'autorité Sira à ce service ; un autre est refusé (`400`).}
    JeuDemande:
      type: object
      required: [code, libelle, niveau, registre]
      additionalProperties: false
      properties:
        code: {type: string}
        libelle: {type: string}
        niveau: {$ref: '#/components/schemas/Niveau'}
        registre: {type: string}
    EtatDemande:
      type: string
      enum: [EN_ATTENTE_ACCORD, REFUSEE, EXPIREE, ANNULEE, EN_COURS, PARTIELLE, COMPLETE]
    DemandeCreee:
      type: object
      required: [id, etat, url_accord, code_court, code_verification, expire_le, jeux]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        etat: {$ref: '#/components/schemas/EtatDemande'}
        url_accord: {type: string, description: Page d'accord de l'espace citoyen (lien ou QR code).}
        code_court:
          type: [string, 'null']
          description: Canal CODE ; absent d'une requête rejouée.
        code_verification:
          type: [string, 'null']
          description: À afficher par le service ; absent d'une requête rejouée.
        expire_le: {type: string, format: date-time}
        jeux:
          type: array
          items: {$ref: '#/components/schemas/JeuDemande'}
    Element:
      type: object
      required: [jeu, etat]
      additionalProperties: false
      properties:
        jeu: {type: string}
        etat:
          type: string
          enum: [A_TRAITER, OBTENU, REUTILISE, REFUSE, INCONNU, EXPIRE]
        attestation: {type: string, description: JWE compact chiffré pour le service ; absent tant qu'il n'est pas
            livrable.}
        prochaine_tentative_le: {type: string, format: date-time, description: Élément `A_TRAITER` seulement.}
    EtatDeLaDemande:
      type: object
      required: [id, etat, pseudonyme, elements]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        etat: {$ref: '#/components/schemas/EtatDemande'}
        pseudonyme:
          type: [string, 'null']
          description: Pseudonyme du citoyen chez ce service, une fois l'accord donné et livrable.
        elements:
          type: array
          items: {$ref: '#/components/schemas/Element'}
    DemarcheDecrite:
      type: object
      required: [code, libelle, jeux]
      additionalProperties: false
      properties:
        code: {type: string}
        libelle: {type: string}
        jeux:
          type: array
          items: {$ref: '#/components/schemas/JeuDemande'}
    Statistiques:
      type: object
      required: [demandes_jour, accords_jour, refus_jour, consultations_jour, pieces_evitees_total]
      additionalProperties: false
      properties:
        demandes_jour: {type: integer, minimum: 0}
        accords_jour: {type: integer, minimum: 0}
        refus_jour: {type: integer, minimum: 0}
        consultations_jour: {type: integer, minimum: 0}
        pieces_evitees_total: {type: integer, minimum: 0}
