        L'objet reste lisible, avec `actif` à faux.

        Rôles : `instructeur`.
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      responses:
        '204': {description: Désactivé (journalisé).}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
  /v1/admin/membres:
    get:
      operationId: listerMembres
      summary: Lister (membres)
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Taille'}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: Page.
