openapi: 3.1.0
info:
  title: Sira — Passerelle
  version: 0.1.0
  summary: Le point d'entrée unique des services et de l'administration du socle.
  description: |-
    Routes des **services** (`/v1/demandes`, `/v1/demarches`), reconnus à leur seul certificat, et de l'**administration** du référentiel (`/v1/admin/**`), appelée par la console avec un jeton du royaume `sira-socle`.

    Servies par le même processus mais décrites ailleurs : `/v1/citoyen/**` (`consentement-minimisation/openapi.yaml`), le journal et les signalements (`journal/openapi.yaml`), `GET /v1/admin/etat` (`resilience/openapi.yaml`).

    Conventions : JSON en `snake_case` (les champs `null` sont rendus), dates ISO 8601 UTC, identifiants UUID, listes paginées (`page` de 1 à 1 000 000, `taille` de 1 à 100), erreurs RFC 9457 en `application/problem+json` avec un `code` stable ; une saisie refusée rend `400`, code `VALIDATION`, et la liste `erreurs` par champ (jamais la valeur reçue). Une erreur interne rend `500` avec une `reference` à citer.
  license: {name: Licence du dépôt Sira}
servers:
- {url: 'https://passerelle:8443', description: Passerelle (mTLS obligatoire)}
tags:
- {name: Services, description: 'Identité `urn:sira:service:<code>` ; le service est celui du certificat, aucun
    paramètre ne le nomme.'}
- {name: Administration, description: 'Identité `urn:sira:socle:console` et jeton du royaume `sira-socle`. Lecture
    : `instructeur`, `autorite`, `auditeur`. Préparer : `instructeur`. Décider (approbation, rejet, suspension,
    adresses de retour, adresse d''un registre) : `autorite`.'}
paths:
  /v1/demandes:
    post:
      tags: [Services]
      operationId: creerDemande
      summary: Demander l'accord du citoyen
      description: |-
        Le service est celui du certificat. Selon le canal :

        - `REDIRECTION` : `retour_url` obligatoire et déclarée pour le service ; `identifiant_unique` facultatif, pas de `pseudonyme`.
        - `CODE` : pas de `retour_url` ; `identifiant_unique` facultatif, pas de `pseudonyme` ; la réponse porte `code_court` et `code_verification`, à afficher.
        - `NOTIFICATION` : `identifiant_unique` ou `pseudonyme` (un seul), pas de `retour_url`.

        Sur `REDIRECTION` et `CODE`, `identifiant_unique` est celui que l'usager a saisi chez le service : seule cette personne pourra ouvrir, accepter ou refuser la demande ; pour toute autre, elle n'existe pas. La réponse est la même que l'identifiant désigne quelqu'un ou non, et le reste du canal ne change pas.

        Rejouée avec la même `Idempotency-Key` et le même contenu, la requête rend la demande déjà créée, sans ses codes. Avec un autre contenu : `409`. Si une autorisation active couvre déjà la démarche, la demande est acceptée d'office.
      security:
      - certificatMembre: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, pattern: '^([A-Za-z0-9_.:-]{8,128})$'}
        example: concours-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NouvelleDemande'}
            example:
              demarche: concours-direct
              canal: CODE
              certificat_chiffrement: |
                -----BEGIN CERTIFICATE-----
                MIIB...(certificat de chiffrement du service, abrégé)...
                -----END CERTIFICATE-----
      responses:
        '201':
          description: Demande créée (ou rejouée).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandeCreee'}
              example:
                id: 8d2f4b61-3c7e-4a90-b5d1-0e9f6a2c7b14
                etat: EN_ATTENTE_ACCORD
                url_accord: http://citoyen.sira.localhost:8600/accord/8d2f4b61-3c7e-4a90-b5d1-0e9f6a2c7b14
                code_court: KLPM-4821
                code_verification: '492113'
                expire_le: '2026-11-16T09:45:00Z'
                jeux:
                - {code: etat-civil.majeur, libelle: Vous êtes majeur, niveau: STATUT, registre: etat-civil}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403':
          description: Certificat qui n'est pas celui d'un service (`acces-refuse`), ou aucune habilitation approuvée
            pour cette démarche (`urn:sira:erreur:habilitation-absente`, code `HABILITATION_ABSENTE`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '404':
          description: Pseudonyme qui ne désigne personne pour ce service (`urn:sira:erreur:citoyen-inconnu`, code
            `CITOYEN_INCONNU`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '409':
          description: '`Idempotency-Key` déjà utilisée avec un autre contenu (`urn:sira:erreur:conflit`, code `CONFLIT`).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
  /v1/demandes/{id}:
    parameters:
    - {$ref: '#/components/parameters/IdDemande'}
    get:
      tags: [Services]
      operationId: lireDemande
      summary: État de la demande et attestations
      description: 'Canal `REDIRECTION` : sans `code_retour`, le service ne lit que l''état (ni attestation ni pseudonyme).
        Les attestations sont des JWE chiffrés pour le service.'
      security:
      - certificatMembre: []
      parameters:
      - name: code_retour
        in: query
        schema: {type: string, pattern: '^([A-Za-z0-9_-]{16,128})$'}
      responses:
        '200':
          description: État.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EtatDeLaDemande'}
              example:
                id: 8d2f4b61-3c7e-4a90-b5d1-0e9f6a2c7b14
                etat: COMPLETE
                pseudonyme: pseudo-concours-7Qm2
                elements:
                - {jeu: etat-civil.majeur, etat: OBTENU, attestation: eyJhbGciOiJFQ0RILUVTIiwiZW5jIjoiQTI1NkdDTSJ9..aXYtZGVtbw.Y2hpZmZyZS1kZW1v.dGFnLWRlbW8}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403':
          description: Certificat refusé (`acces-refuse`), ou `code_retour` faux (`urn:sira:erreur:code-invalide`,
            code `CODE_INVALIDE`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '404': {$ref: '#/components/responses/DemandeIntrouvable'}
    delete:
      tags: [Services]
      operationId: annulerDemande
      summary: Annuler une demande non terminée
      description: Ce qui restait à obtenir ne le sera pas. Annuler une demande déjà annulée ne change rien (`204`).
      security:
      - certificatMembre: []
      responses:
        '204': {description: Annulée (journalisé).}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/DemandeIntrouvable'}
        '409':
          description: 'Demande terminée : elle ne s''annule plus (`urn:sira:erreur:conflit`, code `CONFLIT`).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
  /v1/demarches/{code}:
    get:
      tags: [Services]
      operationId: decrireDemarche
      summary: Les jeux auxquels le service est habilité pour une démarche
      security:
      - certificatMembre: []
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)$'}
      responses:
        '200':
          description: La démarche.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemarcheDecrite'}
              example:
                code: concours-direct
                libelle: Inscription à un concours direct
                jeux:
                - {code: etat-civil.majeur, libelle: Vous êtes majeur, niveau: STATUT, registre: etat-civil}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403':
          description: Aucune habilitation approuvée, que la démarche existe ou non (`urn:sira:erreur:habilitation-absente`,
            code `HABILITATION_ABSENTE`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
  /v1/admin/demarches:
    get:
      operationId: listerDemarches
      summary: Lister (demarches)
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Taille'}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageCommune'}
                - type: object
                  properties:
                    elements:
                      type: array
                      items: {$ref: '#/components/schemas/DemarcheLu'}
              example:
                elements:
                - {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que le candidat
                    remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant organisation
                    des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
                page: 1
                taille: 20
                total: 1
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
    post:
      operationId: creerDemarche
      summary: Créer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Demarche'}
            example: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que le
                candidat remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant organisation
                des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`.'
      responses:
        '201':
          description: Créé (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemarcheLu'}
              example: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que
                  le candidat remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant
                  organisation des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '409':
          description: Ce code est déjà utilisé (`urn:sira:erreur:conflit`, code `CONFLIT`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
  /v1/admin/demarches/{code}:
    parameters:
    - {$ref: '#/components/parameters/Code'}
    get:
      operationId: lireDemarche
      summary: Lire
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: L'objet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemarcheLu'}
              example: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que
                  le candidat remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant
                  organisation des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
    put:
      operationId: modifierDemarche
      summary: Remplacer
      description: |-
        Le code ne se modifie pas (`400`, code `VALIDATION`).

        Rôles : `instructeur`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Demarche'}
            example: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que le
                candidat remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant organisation
                des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      responses:
        '200':
          description: L'objet remplacé (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemarcheLu'}
              example: {code: concours-direct, libelle: Inscription à un concours direct, finalite: Vérifier que
                  le candidat remplit les conditions du concours., base_legale: Arrêté fictif n° 2026-001 portant
                  organisation des concours directs, service: concours, duree_autorisation_jours: 30, actif: true}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
        '409': {$ref: '#/components/responses/Conflit'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
    delete:
      operationId: desactiverDemarche
      summary: Désactiver
      description: |-
        L'objet reste lisible, avec `actif` à faux.

        Rôles : `instructeur`.
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      responses:
        '204': {description: Désactivé (journalisé).}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
  /v1/admin/jeux:
    get:
      operationId: listerJeus
      summary: Lister (jeux)
      parameters:
      - name: registre
        in: query
        schema: {type: string, maxLength: 64}
      - name: niveau
        in: query
        schema:
          type: string
          enum: ['', STATUT, CHAMPS, DOCUMENT]
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Taille'}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageCommune'}
                - type: object
                  properties:
                    elements:
                      type: array
                      items: {$ref: '#/components/schemas/JeuLu'}
              example:
                elements:
                - code: etat-civil.majeur
                  registre: etat-civil
                  niveau: STATUT
                  libelle: Vous êtes majeur
                  description: Répond oui si la personne a 18 ans ou plus.
                  validite: P90D
                  regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
                  champs: null
                  document: null
                  actif: true
                page: 1
                taille: 20
                total: 1
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
    post:
      operationId: creerJeu
      summary: Créer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Jeu'}
            example:
              code: etat-civil.majeur
              registre: etat-civil
              niveau: STATUT
              libelle: Vous êtes majeur
              description: Répond oui si la personne a 18 ans ou plus.
              validite: P90D
              regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
              champs: null
              document: null
              actif: true
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`.'
      responses:
        '201':
          description: Créé (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JeuLu'}
              example:
                code: etat-civil.majeur
                registre: etat-civil
                niveau: STATUT
                libelle: Vous êtes majeur
                description: Répond oui si la personne a 18 ans ou plus.
                validite: P90D
                regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
                champs: null
                document: null
                actif: true
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '409':
          description: Ce code est déjà utilisé (`urn:sira:erreur:conflit`, code `CONFLIT`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
  /v1/admin/jeux/{code}:
    parameters:
    - {$ref: '#/components/parameters/Code'}
    get:
      operationId: lireJeu
      summary: Lire
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `instructeur`, `autorite` ou `auditeur`.'
      responses:
        '200':
          description: L'objet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JeuLu'}
              example:
                code: etat-civil.majeur
                registre: etat-civil
                niveau: STATUT
                libelle: Vous êtes majeur
                description: Répond oui si la personne a 18 ans ou plus.
                validite: P90D
                regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
                champs: null
                document: null
                actif: true
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
    put:
      operationId: modifierJeu
      summary: Remplacer
      description: |-
        Le code ne se modifie pas (`400`, code `VALIDATION`).

        Rôles : `instructeur`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Jeu'}
            example:
              code: etat-civil.majeur
              registre: etat-civil
              niveau: STATUT
              libelle: Vous êtes majeur
              description: Répond oui si la personne a 18 ans ou plus.
              validite: P90D
              regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
              champs: null
              document: null
              actif: true
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      responses:
        '200':
          description: L'objet remplacé (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JeuLu'}
              example:
                code: etat-civil.majeur
                registre: etat-civil
                niveau: STATUT
                libelle: Vous êtes majeur
                description: Répond oui si la personne a 18 ans ou plus.
                validite: P90D
                regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
                champs: null
                document: null
                actif: true
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
        '409':
          description: 'Jeu couvert par une habilitation ou une autorisation : seul `actif` change encore (`urn:sira:erreur:conflit`).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
    delete:
      operationId: desactiverJeu
      summary: Désactiver
