  /v1/admin/registres/{code}/schema:
    parameters:
    - {$ref: '#/components/parameters/Code'}
    get:
      operationId: lireSchemaRegistre
      summary: Ce que le registre expose
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: |-
        Lu à la demande chez le connecteur du registre (`GET /v1/schema`) : les champs que sa
        politique locale expose, avec leur nature (texte, date, nombre, oui/non), leur niveau et les
        questions admises, puis ses documents. Rien n'est conservé par la passerelle.

        Rôles : `instructeur`, `autorite` ou `auditeur`.
      responses:
        '200':
          description: Schéma du registre.
          content:
            application/json:
              schema:
                type: object
                required: [champs, documents]
                properties:
                  champs:
                    type: array
                    items:
                      type: object
                      required: [chemin, libelle, type, niveau]
                      properties:
                        chemin: {type: string, example: date_naissance}
                        libelle: {type: string, example: Date de naissance}
                        type: {type: string, enum: [TEXTE, DATE, NOMBRE, BOOLEEN]}
                        niveau: {type: string, enum: [STATUT, CHAMPS]}
                        operateurs:
                          type: [array, 'null']
                          items: {$ref: '#/components/schemas/Operateur'}
                        valeurs:
                          type: [array, 'null']
                          items: {}
                  documents:
                    type: array
                    items:
                      type: object
                      required: [code, libelle]
                      properties:
                        code: {type: string, example: extrait-naissance}
                        libelle: {type: string, example: Extrait d'acte de naissance}
        '404': {$ref: '#/components/responses/Introuvable'}
        '503':
          description: Le connecteur du registre ne répond pas.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
  /v1/admin/registres/{code}/adresse:
    parameters:
    - {$ref: '#/components/parameters/Code'}
    put:
      operationId: changerAdresse
      summary: Décider de l'adresse du connecteur d'un registre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse]
              properties:
                adresse: {type: string, pattern: '^(https://[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?(:[0-9]{1,5})?)$'}
            example: {adresse: 'https://connecteur-etat-civil:8443'}
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      description: 'Rôles : `autorite`.'
      responses:
        '200':
          description: Le registre (journalisé).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistreLu'}
              example: {code: etat-civil, nom: État civil, membre: etat-civil, adresse: 'https://connecteur-etat-civil:8443',
                transport: DIRECT, actif: true}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '404': {$ref: '#/components/responses/Introuvable'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
  /v1/admin/jeux/essai:
    post:
      operationId: essayerJeu
      summary: Essayer un jeu sur une personne fictive
      description: |-
        Le jeu n'est pas enregistré. La question part au registre comme une vraie ; seul le niveau demandé revient.

        Rôles : `instructeur`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jeu, identifiant_unique]
              properties:
                jeu: {$ref: '#/components/schemas/Jeu'}
                identifiant_unique: {type: string, pattern: '^([A-Za-z0-9]{6,32})$'}
            example:
              jeu:
                code: etat-civil.majeur
                registre: etat-civil
                niveau: STATUT
                libelle: Vous êtes majeur
                description: Répond oui si la personne a 18 ans ou plus.
                validite: P90D
                regle: {champ: date_naissance, operateur: AGE_AU_MOINS, valeur: 18}
                champs: null
                document: null
                actif: true
              identifiant_unique: '990000000001'
      tags: [Administration]
      security:
      - certificatMembre: []
        jetonSocle: []
      responses:
        '200':
          description: Le contenu `resultat` de l'attestation.
          content:
            application/json:
              schema:
                type: object
                required: [resultat]
                additionalProperties: false
                properties:
                  resultat: {type: object}
              example:
                resultat: {valeur: true}
        '400': {$ref: '#/components/responses/RequeteInvalide'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '403': {$ref: '#/components/responses/AccesRefuse'}
        '409':
          description: Le registre ne connaît pas cette personne, ou refuse cette question (`urn:sira:erreur:conflit`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
        '413': {$ref: '#/components/responses/CorpsTropVolumineux'}
        '503':
          description: Registre injoignable ou réponse illisible (`urn:sira:erreur:registre-indisponible`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Probleme'}
