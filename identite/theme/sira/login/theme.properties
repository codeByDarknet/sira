parent=keycloak.v2
import=common/keycloak

# La feuille du thème parent d'abord, la nôtre ensuite. Monter le numéro ?v= à chaque refonte : Keycloak
# la sert avec un cache de 30 jours, à une adresse qui sinon ne change pas.
styles=css/styles.css css/sira-connexion.css?v=12

# Une seule apparence à maintenir et à tester.
darkMode=false

locales=fr,en


# Roue de chargement sur le bouton pendant l'envoi d'un formulaire.
scripts=js/sira-envoi.js

# Démonstration : adresse du téléphone simulé, montrée sur la page du code (vide en production).
siraTelephone=${env.SIRA_TELEPHONE_URL:}
